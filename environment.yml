name: ring2text
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core numeric stack
  - numpy
  - pandas
  - matplotlib
  - seaborn

  # PyTorch CUDA 12.1 stack used by current training scripts
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1

  # Keep pip-installed project libs grouped here for reproducibility.
  - pip:
      - accelerate==1.12.0
      - chronos-forecasting>=2.0
      - huggingface_hub==1.3.4
      - optuna>=3.0
      - peft==0.18.1
      - pyyaml>=6.0
      - safetensors==0.7.0
      - tokenizers==0.22.2
      - tqdm==4.67.1
      - transformers==5.0.0

# Safety check after env creation (project-relevant imports):
#   conda run -n ring2text python -c "import torch; import chronos; import optuna; import yaml"
