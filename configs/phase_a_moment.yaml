# Phase A (MOMENT encoder variant).
#
# Same objective as configs/phase_a.yaml — keystroke-activity + onset
# pretraining with the LLM disabled — but consumes MOMENT embeddings
# instead of Chronos. Produced by:
#     python preprocess.py --config configs/preprocess.yaml \
#         --encoder moment --moment_model AutonLab/MOMENT-1-large
#
# Only the data paths, d_chronos (adapter input dim), and save_dir
# differ from phase_a.yaml. Everything else is kept identical so A/B
# comparisons between encoders are clean.
#
# Usage:
#   python train.py --config configs/phase_a_moment.yaml

# --- Data (MOMENT-suffixed .pt files) ---
data_dir: null
data_file: "./embeddings/train_moment.pt"
val_data_dir: null
val_data_file: "./embeddings/val_moment.pt"

# --- Model (LLM disabled) ---
skip_llm: true
no_keystroke: false
llm: "Qwen/Qwen2.5-1.5B"   # ignored when skip_llm=true; kept for arg parsing
# d_chronos is the adapter input dim. For MOMENT it is d_model × n_channels:
#   MOMENT-1-small (d=512)  → both=3072,  one=1536
#   MOMENT-1-base  (d=768)  → both=9216,  one=4608
#   MOMENT-1-large (d=1024) → both=12288, one=6144   ← default
d_chronos: 12288
n_soft_tokens: 32
n_resampler_layers: 2
adapter_dim: 256
adapter_dropout: 0.1
lora_rank: 0

# --- Training ---
epochs: 100
batch_size: 32
lr: 3.0e-4
weight_decay: 0.05
warmup_steps: 200
grad_accum: 1
max_text_len: 64
max_grad_norm: 1.0

# --- Losses ---
keystroke_weight: 1.0
onset_weight: 1.0
onset_focal_gamma: 2.0
onset_focal_alpha: 0.75
div_weight: 0.0
recon_weight: 0.0
contrast_weight: 0.0

# --- Logging / saving ---
save_dir: "./checkpoints/phase_a_moment"
log_every: 50
val_every: 500
save_every: 1000
n_generate_samples: 5
patience: 8
