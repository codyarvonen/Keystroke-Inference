# RingToText preprocessing configuration
# All values here are the defaults; override by passing --config or individual flags.

# --------------------------------------------------------------------------- #
#  Paths
# --------------------------------------------------------------------------- #
raw_dir: "./data"
output_dir: "./embeddings"

# --------------------------------------------------------------------------- #
#  Data splits
# --------------------------------------------------------------------------- #
val_split: 0.1            # Fraction of sessions held out for validation
test_split: 0.1           # Fraction of sessions held out for testing
seed: 42                  # Random seed for session shuffle

# --------------------------------------------------------------------------- #
#  Chronos encoder
# --------------------------------------------------------------------------- #
# Changing chronos_model also requires updating d_chronos in default.yaml.
#
#   Model                          embed_dim   d_chronos (both rings)   d_chronos (one ring)
#   amazon/chronos-t5-tiny             32            384                     192
#   amazon/chronos-t5-mini            128           1536                     768
#   amazon/chronos-t5-small           256           3072                    1536
#   amazon/chronos-t5-base            768           9216                    4608   ← default
#   amazon/chronos-t5-large          1024          12288                    6144
#
chronos_model: "amazon/chronos-t5-base"
batch_size: 32
device: "cuda:1"

# --------------------------------------------------------------------------- #
#  IMU windowing
# --------------------------------------------------------------------------- #
ring: "both"              # Which ring(s) to encode: L, R, or both
window_size: 10.0         # Sliding window duration in seconds
step_size: 5.0            # Sliding window step size in seconds
min_text_len: 5           # Minimum characters in a window to keep the sample
target_hz: 100            # Target IMU sampling rate (Hz)
no_normalize: false       # Set true to disable per-session per-channel z-score normalisation
