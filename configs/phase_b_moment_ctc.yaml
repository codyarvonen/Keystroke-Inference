# Phase B (MOMENT) — LLM with LoRA, seeded from a CTC-grounded Phase-A adapter.
#
# lora_target_modules should be the WINNING config from Step 1 (attn-only or
# attn+MLP). Defaults here mirror attn-only; swap in the full list if that
# performed better on MOMENT.
#
# char_ctc_weight=0.0 by default: Phase A already baked character identity
# into the adapter, and keeping CTC active during LM fine-tuning mostly adds
# noise. Raise to 0.1 as an explicit ablation if LLM-CER stalls >= 1.0.
#
# Usage:
#   python train.py --config configs/phase_b_moment_ctc.yaml \
#                   --adapter_init ./checkpoints/phase_a_moment_ctc/adapter_best.pt

# --- Data ---
data_dir: null
data_file: "./embeddings/train_moment.pt"
val_data_dir: null
val_data_file: "./embeddings/val_moment.pt"

# --- Model ---
skip_llm: false
no_keystroke: false
llm: "Qwen/Qwen2.5-1.5B"
d_chronos: 12288
n_soft_tokens: 32
n_resampler_layers: 2
adapter_dim: 256
adapter_dropout: 0.1

# --- LoRA — carry the Step 1 winner. Defaults: attention-only, r=8. ---
lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.1
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# --- Adapter freezing ---
# Step 2 re-trains the adapter alongside the CTC head to let LM loss finetune
# both. Override to `true` when isolating LoRA capacity from adapter drift.
freeze_resampler: false

# --- CTC head ---
ctc_upsample_factor: 4
char_ctc_weight: 0.0
char_ctc_start: 0.0
char_ctc_warmup_steps: 0

# --- Training ---
epochs: 100
batch_size: 16
lr: 3.0e-5
weight_decay: 0.1
warmup_steps: 200
grad_accum: 1
max_text_len: 64
max_grad_norm: 0.5

# --- Losses ---
keystroke_weight: 0.3
onset_weight: 0.3
onset_focal_gamma: 2.0
onset_focal_alpha: 0.75
div_weight: 0.0
recon_weight: 0.0
contrast_weight: 0.0
contrast_temp: 0.1

require_adapter_init: true

save_dir: "./checkpoints/phase_b_moment_ctc"
log_every: 50
val_every: 500
save_every: 1000
n_generate_samples: 5
patience: 5
