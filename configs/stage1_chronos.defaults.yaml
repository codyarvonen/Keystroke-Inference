# Stage-1 Chronos + classification head — default training settings.
# Copy this file (e.g. configs/my_run.yaml), edit, and run:
#   python train_stage1_chronos.py --config configs/my_run.yaml
# CLI flags override values from the file.
#
# Keys are the same as in train_stage1_chronos.TRAINING_DEFAULTS. You may group
# them under arbitrary section headings (paths:, training:, …); unknown keys warn.

paths:
  export_dir: stage1_export
  data_dir: data
  out_dir: checkpoints/stage1_chronos
  log_file: null  # default: <out_dir>/train_<timestamp>.log (new file each run)

model:
  chronos_model: autogluon/chronos-2-small
  device: cuda:1
  freeze_encoder: true
  use_embedding_cache: true
  embedding_cache_dir: null  # default: <out_dir>/embedding_cache
  recompute_embedding_cache: false
  cache_test_embeddings: true
  context_length: 256
  # Head: linear | mlp | attention_pool | conv1d | lstm (see models/stage1_heads.py)
  head_type: mlp
  encoder_num_variates: 12
  head_hidden_dim: 256
  head_num_layers: 2
  head_dropout: 0.1
  head_conv_channels: 256
  head_conv_d_proj: 128
  head_conv_kernel_size: 3
  head_conv_num_layers: 2
  head_lstm_hidden_dim: 256
  head_lstm_num_layers: 1

window:
  left_ms: 700
  right_ms: 150
  target_rate_hz: 100.0

training:
  epochs: 100
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 4
  seed: 42
  # Loss: ce | weighted_ce | focal | weighted_focal
  loss_type: weighted_ce
  class_weight_mode: inverse_sqrt  # none | inverse | inverse_sqrt | effective
  focal_gamma: 2.0
  class_balance_beta: 0.9999  # for effective-number weights only

early_stopping:
  patience: 5  # 0 = run all epochs; set e.g. 5 to stop when val plateaus
  min_delta: 0.0
  early_stopping_metric: val_loss  # or val_top1

norm:
  recompute_norm: false
