# Phase B (MOMENT encoder variant).
#
# Same objective as configs/phase_b.yaml — keystroke + LM multi-task
# fine-tuning — but consumes MOMENT embeddings instead of Chronos, and
# must be seeded from the matching Phase-A MOMENT checkpoint.
#
# Usage:
#   python train.py --config configs/phase_b_moment.yaml \
#                   --adapter_init ./checkpoints/phase_a_moment/adapter_best.pt

# --- Data (MOMENT-suffixed .pt files) ---
data_dir: null
data_file: "./embeddings/train_moment.pt"
val_data_dir: null
val_data_file: "./embeddings/val_moment.pt"

# --- Model ---
skip_llm: false
no_keystroke: false
llm: "Qwen/Qwen2.5-1.5B"
# d_chronos = adapter input dim. For MOMENT it is d_model × n_channels:
#   MOMENT-1-small (d=512)  → both=3072,  one=1536
#   MOMENT-1-base  (d=768)  → both=9216,  one=4608
#   MOMENT-1-large (d=1024) → both=12288, one=6144   ← default
d_chronos: 12288
n_soft_tokens: 32
n_resampler_layers: 2
adapter_dim: 256
adapter_dropout: 0.1
lora_rank: 0

# --- Training ---
epochs: 100
batch_size: 16
lr: 3.0e-5
weight_decay: 0.1
warmup_steps: 200
grad_accum: 1
max_text_len: 64
max_grad_norm: 0.5

# --- Losses ---
keystroke_weight: 0.3
onset_weight: 0.3
onset_focal_gamma: 2.0
onset_focal_alpha: 0.75
div_weight: 0.0
recon_weight: 0.0
contrast_weight: 0.0
contrast_temp: 0.1

# --- Required init ---
require_adapter_init: true

# --- Logging / saving ---
save_dir: "./checkpoints/phase_b_moment"
log_every: 50
val_every: 500
save_every: 1000
n_generate_samples: 5
patience: 5
