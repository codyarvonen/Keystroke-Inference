# Ablation: Phase A (MOMENT) CTC without resampler cross-attention in CharCTCHead.
#
# Hypothesis: the 64-token regression (ctc_CER 0.735 vs 0.476 at 32 tokens) is
# caused by diffuse KV gradient — when CharCTCHead cross-attends into N resampler
# tokens, more tokens → more diffuse per-frame gradient → worse character alignment.
# If removing cross-attn entirely (ctc_no_cross_attn=true) recovers ctc_CER toward
# 0.476, the hypothesis is confirmed and per-key supervision (not more tokens) is
# the right escalation path.
#
# Same as phase_a_moment_ctc.yaml (n_soft_tokens=32) except ctc_no_cross_attn=true.
# If ctc_CER here ≈ 0.476 (matches baseline), cross-attn was hurting.
# If ctc_CER here >> 0.476, cross-attn was genuinely helping CTC grounding.
#
# Usage:
#   python train.py --config configs/phase_a_moment_ctc_no_xattn.yaml

# --- Data ---
data_dir: null
data_file: "./embeddings/train_moment.pt"
val_data_dir: null
val_data_file: "./embeddings/val_moment.pt"

# --- Model (LLM disabled) ---
skip_llm: true
no_keystroke: false
llm: "Qwen/Qwen2.5-1.5B"
d_chronos: 12288
n_soft_tokens: 32
n_resampler_layers: 2
adapter_dim: 256
adapter_dropout: 0.1
lora_rank: 0

# --- CTC head (no cross-attention to resampler) ---
ctc_upsample_factor: 4
ctc_no_cross_attn: true
char_ctc_weight: 0.3
char_ctc_start: 0.1
char_ctc_warmup_steps: 2000

# --- Training ---
epochs: 100
batch_size: 32
lr: 3.0e-4
weight_decay: 0.05
warmup_steps: 200
grad_accum: 1
max_text_len: 64
max_grad_norm: 1.0

# --- Losses ---
keystroke_weight: 1.0
onset_weight: 1.0
onset_focal_gamma: 2.0
onset_focal_alpha: 0.75
div_weight: 0.0
recon_weight: 0.0
contrast_weight: 0.0
contrast_temp: 0.1

save_dir: "./checkpoints/phase_a_moment_ctc_no_xattn"
log_every: 50
val_every: 500
save_every: 1000
n_generate_samples: 5
patience: 8
