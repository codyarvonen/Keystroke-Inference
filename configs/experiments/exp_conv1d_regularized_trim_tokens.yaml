# Same recipe as exp_conv1d_regularized.yaml, plus encoder_output_trim: true.
# When enabled, before the head we:
#   1) Drop the last 2 Chronos-2 special slots along L (REG + output-patch token).
#   2) Drop leading time-patch slots that only cover left NaN padding, using each sample's
#      raw window length from the export (collate ``lengths``) and the model's input_patch_size.
#
# Optional overrides (defaults match Chronos-2): encoder_output_drop_last_specials, chronos_input_patch_size.
# Rebuild embedding cache if an older cache has no ``*_embed_lengths.mmap`` sidecar.
#
# Run: python train_stage1_chronos.py --config configs/experiments/exp_conv1d_regularized_trim_tokens.yaml

paths:
  export_dir: stage1_export_coarse_rare_all_p
  data_dir: data
  out_dir: checkpoints/exp_stage1_conv1d_regularized_trim_tokens
  log_file: null

model:
  chronos_model: autogluon/chronos-2-small
  device: cuda:1
  freeze_encoder: true
  use_embedding_cache: true
  embedding_cache_storage: memmap
  embedding_cache_dir: null
  recompute_embedding_cache: false
  cache_test_embeddings: true
  context_length: 256
  head_type: conv1d
  encoder_num_variates: 12
  head_hidden_dim: 256
  head_num_layers: 2
  head_dropout: 0.25
  head_conv_channels: 256
  head_conv_d_proj: 128
  head_conv_kernel_size: 3
  head_conv_num_layers: 2
  head_lstm_hidden_dim: 256
  head_lstm_num_layers: 1
  encoder_output_trim: false

window:
  left_ms: 700
  right_ms: 150
  target_rate_hz: 100.0

training:
  epochs: 100
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 0.05
  num_workers: 4
  seed: 42
  loss_type: weighted_ce
  class_weight_mode: inverse_sqrt
  focal_gamma: 2.0
  class_balance_beta: 0.9999

early_stopping:
  patience: 8
  min_delta: 0.0001
  early_stopping_metric: val_loss

norm:
  recompute_norm: false
