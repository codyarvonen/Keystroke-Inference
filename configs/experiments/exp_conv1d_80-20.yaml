# Stage-1: 80-20 split with the conv1d head.
# Embedding cache is disabled (encoder gradients). Forward uses model.encode (same hidden states as embed).
#
# Run:
#   python train_stage1_chronos.py --config configs/experiments/exp_conv1d_80-20.yaml

paths:
  export_dir: exports/stage1_export_holdout_randval_coarse
  data_dir: data
  out_dir: checkpoints/exp_stage1_conv1d_80-20
  log_file: null

model:
  chronos_model: autogluon/chronos-2-small
  device: cuda:1
  freeze_encoder: true
  encoder_finetune_last_n: 0
  use_embedding_cache: true
  embedding_cache_storage: memmap
  embedding_cache_dir: null
  recompute_embedding_cache: false
  cache_test_embeddings: false
  context_length: 256
  head_type: conv1d
  encoder_num_variates: 12
  head_hidden_dim: 256
  head_num_layers: 2
  head_dropout: 0.25
  head_conv_channels: 256
  head_conv_d_proj: 128
  head_conv_kernel_size: 3
  head_conv_num_layers: 2
  head_lstm_hidden_dim: 256
  head_lstm_num_layers: 1
  encoder_output_trim: false

window:
  left_ms: 700
  right_ms: 150
  target_rate_hz: 100.0

training:
  epochs: 100
  batch_size: 32
  lr: 1.0e-4
  lr_encoder: 1.0e-5
  weight_decay: 0.05
  num_workers: 4
  seed: 42
  loss_type: weighted_ce
  class_weight_mode: inverse_sqrt
  focal_gamma: 2.0
  class_balance_beta: 0.9999

early_stopping:
  patience: 5
  min_delta: 0.0001
  early_stopping_metric: val_loss

norm:
  recompute_norm: false
